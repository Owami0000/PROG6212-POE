name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f RaceDay.sln
          test -d docs
          test -f RaceDay.Api/Program.cs
          test -f RaceDay.Contracts/Dtos.cs
          test -f RaceDay.Mvc/Program.cs
          test -f RaceDay.Mvc/Dockerfile
          test -d RaceDay.Api.Tests

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages (API, Contracts, MVC, tests)
        run: dotnet restore RaceDay.sln

      - name: Build solution (includes RaceDay.Mvc)
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC Docker image
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:ci .
